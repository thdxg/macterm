<h2>Fixes</h2>
<ul>
<li>Confirmation alerts answer the keyboard again: Return confirms and Escape cancels, so closing a busy pane or tab — or unloading a project, removing one, or applying a layout — no longer ends at the mouse. (#388, #389)</li>
</ul>
