<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="theme-color" content="#111214" />
  <link rel="canonical" href="{{CANONICAL}}" />

  <link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/img/icon-16.png" />
  <link rel="apple-touch-icon" href="/img/icon-180.png" />

  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="Macterm" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <meta property="og:url" content="{{CANONICAL}}" />
  <meta property="og:image" content="{{SITE_URL}}/img/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Macterm on macOS. A vertical project sidebar is next to an editor pane and a shell pane." />
  <meta property="og:locale" content="en_US" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{TITLE}}" />
  <meta name="twitter:description" content="{{DESCRIPTION}}" />
  <meta name="twitter:image" content="{{SITE_URL}}/img/og.png" />
  <meta name="twitter:image:alt" content="Macterm on macOS. A vertical project sidebar is next to an editor pane and a shell pane." />

  <!-- Open Sans and Fira Code load through components/bundle.css's @import. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/components/bundle.css" />

  <script type="application/ld+json">{{JSONLD}}</script>
</head>
<body class="ec ec-docs">

  <!-- Phones only: the brand and the button that opens the index (site.js's docsMenu). -->
  <div class="ec-docs-bar">
    <a class="ec-docs-brand" href="/">Macterm</a>
    <button type="button" class="ec-menu-btn" aria-controls="docs-index" aria-expanded="false" aria-label="Pages">
      <svg class="ec-menu-open" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7h14M3 13h14"/></svg>
      <svg class="ec-menu-close" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
    </button>
  </div>

  <!-- The index, pinned to the left edge (generated: links to every page, current one marked) -->
  <nav class="ec-docs-side" id="docs-index" aria-label="Docs">
    <a class="ec-docs-brand" href="/">Macterm</a>
    <div class="ec-docs-nav">
<!-- SIDEBAR -->
    </div>
    <div class="ec-docs-side-foot">
      <a href="/">Home</a>
      <a href="https://github.com/thdxg/macterm">GitHub ↗</a>
      <a href="https://github.com/thdxg/macterm/releases">Releases ↗</a>
    </div>
  </nav>

  <!-- The page, centered in the window on desktops -->
  <main class="ec-docs-main">
    <!-- content (rendered from this page's Markdown) -->
    <article class="ec-prose">
<!-- CONTENT -->
    </article>
<!-- PAGENAV -->
  </main>

  <!-- Desktops: the page fades out under these as it scrolls (site.js's docsFades) -->
  <div class="ec-docs-fade ec-docs-fade--top" aria-hidden="true"></div>
  <div class="ec-docs-fade ec-docs-fade--bottom" aria-hidden="true"></div>

  <script src="/site.js"></script>
</body>
</html>
