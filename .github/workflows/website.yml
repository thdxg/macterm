name: Website

# Builds the website container image (website/Dockerfile) and publishes it to
# ghcr.io. Pull requests build both architectures but push nothing, so a broken
# Dockerfile is caught before it can replace :latest.
#
# The image is assembled the "native runner" way — one job per architecture on
# a matching runner, each pushing an untagged blob addressed by digest, then a
# publish job stitching the digests into one multi-arch manifest. The obvious
# alternative, a single job emulating arm64 through QEMU, is what this avoids:
# Bun is a poor fit for qemu-aarch64, and arm64 runners are free for public
# repositories anyway.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "assets/**"
      - ".github/workflows/website.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "assets/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/website

# A superseded push is never worth finishing — the image it would publish is
# already stale. In-flight PR builds are cancelled the same way.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # The build context is the repository root, not website/ — see the header
      # of website/Dockerfile for why (public/assets is a symlink out of it).
      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: website/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=website-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=website-${{ matrix.arch }}
          # No tag here: each arch pushes by digest only, and the publish job
          # below is what gives the resulting manifest list its tags.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Three tags, each with a job. :latest is what a human pulls;
          # :sha-<short> is the way back to a specific build after a bad one;
          # and the UTC timestamp tag is what the cluster deploys, because
          # Flux's ImagePolicy picks the newest image by sorting tag strings
          # (`alphabetical: asc`) and neither of the other two orders. Keep the
          # timestamp first and zero-padded — that is what makes lexical order
          # and chronological order the same thing. Changing this format means
          # changing the `filterTags` pattern in the homelab repo's
          # apps/macterm/manifests/image.yaml to match.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=raw,value={{date 'YYYYMMDD-HHmmss' tz='UTC'}}-{{sha}},enable={{is_default_branch}}

      - name: Create and push the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
