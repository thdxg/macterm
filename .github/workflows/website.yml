name: Website

# Builds the website container image (website/Containerfile) with podman and
# publishes it to ghcr.io. Pull requests build but push nothing, so a broken
# Containerfile is caught before it can replace :latest.
#
# arm64 only, built natively on an arm64 runner: the cluster that runs the site
# is arm64, and nothing else pulls the image.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "assets/**"
      - ".containerignore"
      - ".github/workflows/website.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "assets/**"
      - ".containerignore"
      - ".github/workflows/website.yml"
  # /changelog on main shows the release notes, so a published, edited or
  # deleted release makes the site stale. A release event runs this file as the
  # release's tag has it, so a release from the v1 branch needs this trigger
  # here too. Events that GITHUB_TOKEN raises start no runs, so only a person's
  # action fires this.
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/website
  LOCAL_IMAGE: localhost/macterm-website:ci

# A superseded push is never worth finishing — the image it would publish is
# already stale. In-flight PR builds are cancelled the same way.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A release event runs on the release's tag, not on main. Built there, the
  # image would be the tag's old site, and metadata-action gives it none of the
  # tags that the cluster deploys (they need the default branch). So a release
  # only starts a run on main. GITHUB_TOKEN can start a workflow_dispatch run.
  rebuild-for-release:
    name: Rebuild for Release
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Start a build on main
        run: gh workflow run website.yml --ref main

  build:
    name: Build
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # skopeo is only used after a push, so check it here, where a pull
      # request fails on it too.
      - name: Tool versions
        run: |
          podman version
          skopeo --version

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Three tags, each with a job. :latest is what a human pulls;
          # :sha-<short> is the way back to a specific build after a bad one;
          # and the UTC timestamp tag is what the cluster deploys, because
          # Flux's ImagePolicy picks the newest image by sorting tag strings
          # (`alphabetical: asc`) and neither of the other two orders. Keep the
          # timestamp first and zero-padded — that is what makes lexical order
          # and chronological order the same thing. Changing this format means
          # changing the `filterTags` pattern in the homelab repo's
          # apps/macterm/manifests/image.yaml to match.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=raw,value={{date 'YYYYMMDD-HHmmss' tz='UTC'}}-{{sha}},enable={{is_default_branch}}

      # The build context is the repository root, not website/ — see the header
      # of website/Containerfile for why (public/assets is a symlink out of it),
      # and for why the format is docker rather than OCI.
      - name: Build
        run: |
          labels=()
          while IFS= read -r label; do
            [ -n "$label" ] && labels+=(--label "$label")
          done <<< "$DOCKER_METADATA_OUTPUT_LABELS"
          podman build \
            --format docker \
            --platform linux/arm64 \
            --file website/Containerfile \
            "${labels[@]}" \
            --tag "$LOCAL_IMAGE" \
            .

      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | podman login "$REGISTRY" --username "$ACTOR" --password-stdin

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          while IFS= read -r tag; do
            podman push --format v2s2 "$LOCAL_IMAGE" "docker://$tag"
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

      - name: Inspect
        if: github.event_name != 'pull_request'
        run: |
          skopeo inspect --raw \
            "docker://$REGISTRY/$IMAGE_NAME:${{ steps.meta.outputs.version }}" | jq .
