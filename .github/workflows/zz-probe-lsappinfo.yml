# TEMPORARY probe, to be removed: what lsappinfo prints on the runner image.
name: zz-probe-lsappinfo
on:
  push:
    branches: [claude/xenodochial-edison-1d89ab]
jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: lsappinfo on this runner
        run: |
          sw_vers
          echo "--- front"; lsappinfo front
          echo "--- info -only pid (front)"; lsappinfo info -only pid "$(lsappinfo front)" || true
          echo "--- finder"; lsappinfo info -only pid -app com.apple.finder || true
          echo "--- open -a TextEdit"; open -a TextEdit; sleep 3
          echo "--- front after"; lsappinfo front
          lsappinfo info -only pid "$(lsappinfo front)" || true
          echo "--- open -a Finder"; open -a Finder; sleep 3
          echo "--- front after"; lsappinfo front
          lsappinfo info -only pid "$(lsappinfo front)" || true
          echo "--- ps front"; ps -p "$(lsappinfo info -only pid "$(lsappinfo front)" | grep -oE '[0-9]+' | head -1)" -o comm= || true
