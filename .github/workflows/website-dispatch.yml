name: Website Dispatch

# The site (macterm/website) renders docs/ and serves assets/ of this
# repository, and its changelog shows the release notes. This workflow tells it
# to build again when one of them changes. The site's own workflow checks out
# this repository at main, so the build always reads what main has.
#
# Events that GITHUB_TOKEN raises start no runs, so only a person's action on a
# release fires this: publishing a release, editing its notes, promoting a
# beta. That is every change to the notes that matters.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "assets/**"
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    name: Start a Site Build
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN cannot reach another repository. WEBSITE_DISPATCH_TOKEN
      # is a token with contents write on macterm/website and nothing else.
      - name: Send repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          REASON: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          gh api repos/macterm/website/dispatches \
            -f event_type=macterm-content \
            -f "client_payload[reason]=$REASON" \
            -f "client_payload[sha]=$SHA"
