name: Session Benchmark

# The v1/v2 session layer benchmark and its gate (scripts/session_bench.py).
# AGENTS.md ("Session layer benchmark") says what it measures and when it
# fails. The workflow starts on every pull request, so that its checks report
# also where they are required. The measuring jobs skip when the pull request
# changes no file of the session layer.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: session-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The files that the pull request changes, from the merge commit, as in
  # server.yml. A run by hand always measures.
  changes:
    name: Find Session Layer Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bench: ${{ steps.changes.outputs.bench }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Find Session Layer Changes
        id: changes
        shell: bash
        run: |
          bench=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files="$(git diff --no-renames --name-only HEAD^1 HEAD)"
            if ! grep -qE '^(server/|protocol/|scripts/session_bench(\.py|_limits\.json)$|scripts/build-server\.sh$|\.github/workflows/(session-bench|server-build)\.yml$)' <<<"$files"; then
              bench=false
            fi
          fi
          echo "bench=$bench" | tee -a "$GITHUB_OUTPUT"

  # The session server of this commit (server-build.yml).
  server:
    name: Server
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/server-build.yml

  # v1's and v2's local panes side by side. The idle arm reads libproc, so it
  # runs on macOS only.
  macos:
    name: Session Layer (macOS)
    needs: server
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the Server
        uses: actions/download-artifact@v8
        with:
          name: server
          path: build/server

      - name: Unpack the Server
        env:
          KEY: ${{ needs.server.outputs.key }}
        run: |
          name="macterm-$KEY-universal-macos.tar.gz"
          (cd build/server && shasum -a 256 -c "$name.sha256")
          mkdir -p zmx
          tar xzf "build/server/$name" -C zmx zmx
          zmx/zmx version

      - name: Measure
        run: |
          python3 scripts/session_bench.py run --zmx zmx/zmx --out session-macos.json
          python3 scripts/session_bench.py report session-macos.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: session-results-macos
          path: session-macos.json

      # Fails when v2 is worse than v1 beyond the limits.
      - name: Compare v2 with v1
        run: python3 scripts/session_bench.py check session-macos.json >> "$GITHUB_STEP_SUMMARY"

  # The latency arms plus the ssh arms, against sshd on localhost with 25 ms
  # of delay each way (50 ms round trip) and 100 Mbit/s. Linux, because sshd
  # and netem are an apt install there. GitHub-hosted, because the Blacksmith
  # VM kernel has no sch_netem module.
  linux:
    name: Session Layer (Linux)
    needs: server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the Server
        uses: actions/download-artifact@v8
        with:
          name: server
          path: build/server

      - name: Unpack the Server
        env:
          KEY: ${{ needs.server.outputs.key }}
        run: |
          name="macterm-$KEY-x86_64-linux.tar.gz"
          (cd build/server && sha256sum -c "$name.sha256")
          mkdir -p zmx
          tar xzf "build/server/$name" -C zmx zmx
          zmx/zmx version

      - name: Start sshd on localhost
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no localhost true

      - name: Delay Loopback by 25 ms and Limit It to 100 Mbit/s
        run: |
          sudo modprobe sch_netem || true
          sudo tc qdisc add dev lo root netem delay 25ms rate 100mbit
          ping -c 3 localhost

      - name: Measure
        run: |
          python3 scripts/session_bench.py run --zmx zmx/zmx --ssh-host localhost \
            --network "localhost, netem delay 25 ms each way, 100 Mbit/s" --out session-linux.json
          python3 scripts/session_bench.py report session-linux.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: session-results-linux
          path: session-linux.json

      # Fails when v2 is worse than v1 beyond the limits.
      - name: Compare v2 with v1
        run: python3 scripts/session_bench.py check session-linux.json >> "$GITHUB_STEP_SUMMARY"
