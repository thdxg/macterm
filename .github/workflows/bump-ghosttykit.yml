name: Bump GhosttyKit

# GhosttyKit is pinned to one thdxg/ghostty release (GHOSTTYKIT_TAG in
# scripts/setup.sh) so a Macterm build can't silently pick up whatever
# libghostty landed that morning. A pin needs a way back off it, or it rots:
# this opens the PR, weekly, and CI is the gate.
#
# The PR is a real test, not a rubber stamp. Changing setup.sh changes the
# GhosttyKit cache key (every workflow keys on hashFiles('scripts/setup.sh')),
# so the run downloads the NEW pin from scratch and puts it through Unit,
# End-to-end, and the benchmark. That is the check that would have caught the
# sentry-init crash before it shipped in a release.
#
# Dependabot can't do this — a GitHub release asset is not a package ecosystem —
# but the cadence, labels, and commit prefix match .github/dependabot.yml so
# these land in the same review lane as the actions bumps.
on:
  schedule:
    # Mondays, same as dependabot's actions group.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# A second run while a bump PR is open would just recompute the same branch.
concurrency:
  group: bump-ghosttykit
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # A PR opened by the default GITHUB_TOKEN does NOT trigger workflows, which
      # would defeat the entire point — the bump would arrive untested. So the
      # `gh pr create` below has to run as a user (or app) token: every CI
      # workflow triggers on `pull_request`, and only that event has to escape
      # the suppression. The branch push can stay on the checkout's GITHUB_TOKEN,
      # since nothing triggers on a push to a non-main branch.
      #
      # GH_PAT exists for this workflow ALONE — nothing else here needs a PAT.
      # `thdxg/ghostty` is public, so setup.sh's release downloads work under
      # GITHUB_TOKEN in every other workflow (release.yml's build job included);
      # the only other PAT in the repo is HOMEBREW_TAP_PAT, for writing the tap.
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      # An absent secret interpolates to empty, and gh's own complaint about that
      # is "To use GitHub CLI in a GitHub Actions workflow, set the GH_TOKEN
      # environment variable" — which reads as a workflow bug, not a missing
      # secret. The first scheduled run (30802571959) died that way in 8s. Name
      # the real cause before spending a step on it.
      - name: Check the bump token
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            {
              echo "error: the GH_PAT repo secret is unset or empty."
              echo "  This workflow needs a token that is NOT GITHUB_TOKEN, because a PR"
              echo "  opened by GITHUB_TOKEN triggers no workflows — and CI on the bump PR"
              echo "  is the only thing that tests the new pin."
              echo "  Fix: add a fine-grained PAT scoped to this repo, with Contents"
              echo "  read+write and Pull requests read+write, as the GH_PAT secret."
            } >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Resolve latest, compare with the pin
        id: check
        run: |
          CURRENT=$(grep -oE 'GHOSTTYKIT_TAG:-[^}]+' scripts/setup.sh | cut -d- -f2- | sed 's/^://')
          if [[ -z "$CURRENT" ]]; then
            echo "error: could not parse GHOSTTYKIT_TAG out of scripts/setup.sh" >&2
            exit 1
          fi
          LATEST=$(gh release list --repo thdxg/ghostty --limit 1 --json tagName -q '.[0].tagName')
          if [[ -z "$LATEST" ]]; then
            echo "error: could not resolve the latest thdxg/ghostty release" >&2
            exit 1
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          if [[ "$CURRENT" == "$LATEST" ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Pin is already at $LATEST — nothing to do."
            exit 0
          fi

          # One branch per target tag, so a re-run while that PR is open is a
          # no-op instead of a duplicate. Checked here rather than later so the
          # header download and report are skipped too.
          BRANCH="chore/ghosttykit-${LATEST}"
          if gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' | grep -q .; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "PR for $BRANCH is already open — leaving it alone."
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Pin $CURRENT is behind $LATEST."

      # Diff the header we're moving between, filtered to the symbols Macterm
      # actually calls. ghostty.h is ~1200 lines and a week of upstream churn
      # touches plenty of it, almost none of which we use — without this the PR
      # can only say "skim the compare view", and the handful of lines that
      # matter stay buried. This is what surfaces e.g. an enum member inserted
      # mid-enum, which renumbers constants we consume without changing a line
      # we grep for.
      - name: Build the API review
        id: api
        if: steps.check.outputs.proceed == 'true'
        env:
          CURRENT: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          hdr() {  # hdr <tag> <dest-dir>
            mkdir -p "$2"
            gh release download "$1" --pattern 'GhosttyKit.xcframework.tar.gz' \
              --repo thdxg/ghostty --dir "$2"
            tar xzf "$2/GhosttyKit.xcframework.tar.gz" -C "$2"
          }
          hdr "$CURRENT" old
          hdr "$LATEST" new

          # Glob the slice dir rather than naming it: the macOS slice's name is
          # chosen by the fork's build, and hardcoding it would silently break
          # this report if it were ever renamed (same reasoning as setup.sh's
          # has_output_activity_action).
          OLD_H=$(echo old/GhosttyKit.xcframework/macos-*/Headers/ghostty.h)
          NEW_H=$(echo new/GhosttyKit.xcframework/macos-*/Headers/ghostty.h)
          if [[ ! -f "$OLD_H" || ! -f "$NEW_H" ]]; then
            echo "warning: could not locate both headers; skipping the API review" >&2
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Advisory: a bad report must never block the bump PR, since the PR is
          # how the new pin gets tested at all.
          if ./scripts/ghosttykit-api-diff.sh "$OLD_H" "$NEW_H" "$CURRENT" "$LATEST" > api-review.md; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            cat api-review.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "warning: api-diff script failed; opening the PR without a review section" >&2
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the bump PR
        if: steps.check.outputs.proceed == 'true'
        env:
          CURRENT: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
          BRANCH: ${{ steps.check.outputs.branch }}
          API_OK: ${{ steps.api.outputs.ok }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          # Rewrite only the default in the parameter expansion, so the
          # GHOSTTYKIT_TAG override keeps working.
          sed -i -E "s/(GHOSTTYKIT_TAG:-)[^}]+/\1${LATEST}/" scripts/setup.sh
          if git diff --quiet scripts/setup.sh; then
            echo "error: sed matched nothing; the GHOSTTYKIT_TAG line must have changed shape" >&2
            exit 1
          fi
          # Confirm the file reads as the new tag rather than trusting the
          # substitution.
          APPLIED=$(grep -oE 'GHOSTTYKIT_TAG:-[^}]+' scripts/setup.sh | cut -d- -f2- | sed 's/^://')
          if [[ "$APPLIED" != "$LATEST" ]]; then
            echo "error: pin reads '$APPLIED' after rewrite, expected '$LATEST'" >&2
            exit 1
          fi

          git add scripts/setup.sh
          git commit -m "chore(deps): bump GhosttyKit to ${LATEST}" \
                     -m "Moves the pinned thdxg/ghostty release from ${CURRENT} to ${LATEST}. Opened by .github/workflows/bump-ghosttykit.yml."
          # --force, because anything that fails AFTER this push leaves the branch
          # on the remote and wedges every later run: the next one rebuilds the
          # same one-line change as a new commit (new timestamp, new SHA) on the
          # same base, and a plain push is then rejected non-fast-forward — which
          # is what happened once `gh pr create` started failing. The branch is
          # safe to overwrite: it is named per target tag and owned entirely by
          # this workflow, and the check step already returned early if a PR for
          # it is open, so this can never clobber a branch under review.
          git push --force origin "$BRANCH"

          # Built as a file, not an inline string: a multi-line --body inside a
          # YAML block scalar is indentation-fragile, and markdown turns a stray
          # indent into a code block.
          {
            echo "Moves the pinned \`thdxg/ghostty\` release (\`GHOSTTYKIT_TAG\` in \`scripts/setup.sh\`) from \`${CURRENT}\` to \`${LATEST}\`."
            echo
            echo "**CI on this PR is the gate.** Editing \`scripts/setup.sh\` changes the GhosttyKit cache key, so this run downloads the new pin from scratch and exercises it through Unit, End-to-end, and the benchmark — rather than a release being the first thing to try it."
            echo
            echo "Compare upstream: [\`${CURRENT}...${LATEST}\`](https://github.com/thdxg/ghostty/compare/${CURRENT}...${LATEST})"
            echo
            echo "---"
            echo
            if [[ "$API_OK" == "true" && -f api-review.md ]]; then
              cat api-review.md
            else
              echo "_The API review could not be generated for this bump — check the workflow log. Review the compare link by hand._"
            fi
          } > pr-body.md

          # gh reports a PAT that can't open PRs as a bare "Resource not accessible
          # by personal access token", naming neither the token nor the permission.
          # Say both, and say that the push succeeding proves nothing about it —
          # that push used the checkout's GITHUB_TOKEN, not GH_PAT.
          if ! gh pr create \
            --base main --head "$BRANCH" \
            --title "chore(deps): bump GhosttyKit to ${LATEST}" \
            --label dependencies --label area:ci \
            --body-file pr-body.md
          then
            {
              echo "error: the bump commit is pushed to $BRANCH, but opening its PR failed."
              echo "  If the message above is 'Resource not accessible by personal access"
              echo "  token', GH_PAT is missing Pull requests: read+write on this repo."
              echo "  Grant it and re-run — the branch is reused, not duplicated."
            } >&2
            exit 1
          fi
