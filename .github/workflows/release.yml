name: Release

# Triggered by publishing a GitHub Release (not a bare tag push), so the
# release's `prerelease` flag — a first-class boolean — gates the stable
# distribution channels. A prerelease still builds and attaches DMGs for
# testers, but skips the appcast (auto-update feed) and the Homebrew tap.
on:
  release:
    types: [published]

jobs:
  # Resolve the prerelease flag ONCE, live, from the release itself — never from
  # `github.event.release.prerelease`.
  #
  # The payload is a snapshot frozen when the event was dispatched, and editing a
  # release does not re-fire `published`. Promote a prerelease to stable in the
  # same breath as publishing it and every job reads the STALE value: v1.21.0
  # shipped that way (2026-08-01, run 30699334224) — the release record said
  # `prerelease: false`, the payload said true, so `bump-cask` skipped and the
  # appcast never got an item. Don't expect the old giveaway — the run's display
  # title showing a pre-edit release name against the real tag ("Macterm v1.20.11"
  # on tag v1.21.0). It renders LIVE from the release name, so it re-wrote itself
  # to `v1.21.0` the moment that release was retitled, and release names are now
  # just the tag anyway, so the two can no longer visibly disagree. What a repeat
  # looks like today is silent: a skipped `bump-cask` and an appcast with no item.
  #
  # `gh release view` asks the API for current truth, so this is correct no matter
  # which activity type fired or how the release was edited beforehand. Preferred
  # over adding `released` to `types:` because that only patches the one path we
  # happened to hit, and GitHub's own docs don't state whether `released` fires on
  # an edit-to-promote at all — the guess that "the event surely reflects the
  # release" is what caused this bug, so don't re-make it in a new spot.
  flag:
    runs-on: ubuntu-latest
    # Explicit: reading a release only needs contents:read, and declaring it
    # keeps the job working if the repo's default workflow token is ever
    # tightened.
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      prerelease: ${{ steps.read.outputs.prerelease }}
    steps:
      - name: Read live prerelease flag
        id: read
        run: |
          PRERELEASE=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')
          # Fail loudly rather than defaulting: a silent "false" would leak a
          # beta into the stable channel and the Homebrew tap.
          if [[ "$PRERELEASE" != "true" && "$PRERELEASE" != "false" ]]; then
            echo "error: could not read prerelease flag for '$GITHUB_REF_NAME' (got '$PRERELEASE')" >&2
            exit 1
          fi
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Live prerelease flag for $GITHUB_REF_NAME: $PRERELEASE"

  build:
    needs: flag
    runs-on: macos-26
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4.2.5

      # ISO week (YYYY-Www) — makes the GhosttyKit cache self-refresh weekly.
      - name: Cache epoch
        id: epoch
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # GhosttyKit + bundled resources + zmx: shared verbatim with the test and
      # benchmark workflows (identical key), so a release rides the cache they
      # keep warm. Only the source-independent download is cached — NOT
      # DerivedData: a release is a clean universal Release build so the shipped
      # binary can't inherit a stale incremental artifact.
      - name: Cache GhosttyKit
        uses: actions/cache@v6
        with:
          path: |
            GhosttyKit.xcframework
            Macterm/Resources/ghostty
            Macterm/Resources/terminfo
            Macterm/Resources/zmx
            .ghosttykit-tag
          # The tag stamp is cached with the artifacts it describes (test.yml).
          #
          # NO restore-keys fallback: pairing a time-rolling key with a prefix
          # restore-key re-saves stale content under the fresh key forever (see
          # test.yml). Without it a new week re-downloads the current `latest`.
          key: ghosttykit-${{ hashFiles('scripts/setup.sh') }}-${{ steps.epoch.outputs.week }}

      - name: Setup GhosttyKit
        run: mise run setup --verbose

      # Import the stable self-signed release certificate and hand its identity
      # to build.sh via MACTERM_CODESIGN_IDENTITY. macOS TCC keys privacy
      # grants (Documents, Downloads, …) to the app's code-signing designated
      # requirement; ad-hoc signing (what releases shipped with before) bakes
      # the per-build CDHash into that requirement, so every update looked like
      # a new app and dropped every grant. Signing every release with ONE
      # certificate keeps the requirement stable, so grants survive updates.
      # Gatekeeper is unchanged (still self-signed, still needs the first-install
      # xattr) — TCC doesn't require a trusted anchor, only the same cert.
      #
      # Missing secrets FAIL the release rather than falling back to ad-hoc: a
      # silent fallback would ship an update that resets every user's grants
      # once more, which is exactly the bug this exists to fix — and the next
      # properly-signed release would reset them yet again. The generation
      # recipe lives in AGENTS.md's Releasing section (a once-a-decade ceremony,
      # so no script); never rotate the cert casually (a new cert is one more
      # reset), and back it up like the Sparkle private key.
      - name: Import signing certificate
        env:
          MACTERM_SIGNING_CERT_P12: ${{ secrets.MACTERM_SIGNING_CERT_P12 }}
          MACTERM_SIGNING_CERT_PASSWORD: ${{ secrets.MACTERM_SIGNING_CERT_PASSWORD }}
        run: |
          if [[ -z "$MACTERM_SIGNING_CERT_P12" || -z "$MACTERM_SIGNING_CERT_PASSWORD" ]]; then
            echo "error: MACTERM_SIGNING_CERT_P12 / MACTERM_SIGNING_CERT_PASSWORD repo secrets are not set." >&2
            echo "Releases are signed with a stable certificate so users' privacy grants survive" >&2
            echo "updates. Follow the recipe in AGENTS.md's Releasing section to create the cert" >&2
            echo "and add the secrets." >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/macterm-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          P12="$RUNNER_TEMP/macterm-signing.p12"
          printf '%s' "$MACTERM_SIGNING_CERT_P12" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -f pkcs12 \
            -P "$MACTERM_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          # Let codesign reach the key headlessly (no UI to answer a prompt).
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # Trust settings don't travel inside a .p12, and codesign refuses an
          # identity whose chain doesn't end at a trusted anchor — so trust the
          # self-signed cert explicitly (runners have passwordless sudo).
          CERT_PEM="$RUNNER_TEMP/macterm-signing.pem"
          /usr/bin/openssl pkcs12 -in "$P12" -clcerts -nokeys \
            -passin env:MACTERM_SIGNING_CERT_PASSWORD -out "$CERT_PEM"
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain "$CERT_PEM"
          # Resolve the identity by hash (unambiguous even if a runner image
          # ever ships a similarly named cert). find-identity -v requires the
          # trust added above, so a bad import fails HERE, not mid-build.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '$2 ~ /^[0-9A-F]{40}$/ {print $2; exit}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "error: imported certificate is not a valid code-signing identity:" >&2
            security find-identity -p codesigning "$KEYCHAIN" >&2
            exit 1
          fi
          echo "MACTERM_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$P12" "$CERT_PEM"

      - name: Build universal release artifact
        env:
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
          PRERELEASE: ${{ needs.flag.outputs.prerelease }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # A `-beta.N` suffix is accepted ONLY on a release flagged prerelease,
          # so a stable release can never ship a beta version string (and a beta
          # tag can't sneak into the stable channel by forgetting the flag).
          if [[ "$PRERELEASE" == "true" ]]; then
            PATTERN='^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$'
            EXPECTED="vX.Y.Z or vX.Y.Z-beta.N"
          else
            PATTERN='^[0-9]+\.[0-9]+\.[0-9]+$'
            EXPECTED="vX.Y.Z"
          fi
          if ! [[ "$VERSION" =~ $PATTERN ]]; then
            echo "error: tag '$GITHUB_REF_NAME' is not $EXPECTED; refusing to build a placeholder release" >&2
            exit 1
          fi
          # Release builds invoke the build script directly to skip the
          # format/lint/test deps on `mise run build` — main is already
          # format/lint-gated by checks.yml and test-gated by test.yml before
          # a tag is cut, so a release just needs the build itself. Equivalent
          # to the old ci:build.
          VERSION="$VERSION" ./scripts/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: build/*.dmg

  release:
    needs: [flag, build]
    runs-on: macos-26
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Job-level so both the version gate and the appcast step read the same
      # flag. Sourced from the `flag` job's live API read, not the event payload
      # (see the comment there). Renders as the string "true"/"false".
      PRERELEASE: ${{ needs.flag.outputs.prerelease }}
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dmgs
          merge-multiple: true

      - name: Publish GitHub release
        id: release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Mirrors the build job's gate (see the comment there).
          if [[ "$PRERELEASE" == "true" ]]; then
            PATTERN='^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$'
            EXPECTED="vX.Y.Z or vX.Y.Z-beta.N"
          else
            PATTERN='^[0-9]+\.[0-9]+\.[0-9]+$'
            EXPECTED="vX.Y.Z"
          fi
          if ! [[ "$VERSION" =~ $PATTERN ]]; then
            echo "error: tag '$GITHUB_REF_NAME' is not $EXPECTED; refusing to publish a placeholder release" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dmgs/*.dmg --clobber
          # Ensure the release is published (not left as draft), and re-assert
          # the prerelease flag explicitly: publishing a draft in the same call
          # would otherwise be a chance to drop it, which would leak a beta
          # into the stable channel on a re-run.
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ── Appcast generation ────────────────────────────────────────────
      # Sparkle's `sign_update` produces an EdDSA signature for each DMG.
      # We then append a new <item> to the appcast on the gh-pages branch,
      # which is served as https://thdxg.github.io/macterm/appcast.xml.
      #
      # BOTH stable and prerelease publish here now — one feed, two channels.
      # A prerelease's <item> carries <sparkle:channel>beta</sparkle:channel>,
      # which Sparkle hides from any updater that hasn't opted into the `beta`
      # channel. What still stays stable-only is the Homebrew tap (below).

      - name: Install Sparkle tools
        run: |
          SPARKLE_VERSION="2.9.1"
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o sparkle.tar.xz
          mkdir -p sparkle && tar -xf sparkle.tar.xz -C sparkle
          echo "$PWD/sparkle/bin" >> "$GITHUB_PATH"

      - name: Publish appcast to gh-pages
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: scripts/publish-appcast.sh dmgs

  bump-cask:
    needs: [flag, release]
    # Prereleases never bump the Homebrew tap — stable installs stay stable.
    #
    # Compared as an explicit string, NOT `!needs.flag.outputs.prerelease`. Job
    # outputs are always strings, and every non-empty string is truthy in a
    # GitHub expression — so `!'false'` is `false` and the negation form would
    # skip this job on EVERY release, stable ones included. (The old
    # `!github.event.release.prerelease` was safe only because the event payload
    # carries a real JSON boolean; that property is lost the moment the value
    # comes from a job output.)
    if: ${{ needs.flag.outputs.prerelease == 'false' }}
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_PAT }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Compute DMG sha256
        id: hash
        run: |
          URL="https://github.com/thdxg/macterm/releases/download/v${VERSION}/Macterm-${VERSION}.dmg"
          curl -fsSL "$URL" -o macterm.dmg
          echo "sha256=$(shasum -a 256 macterm.dmg | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: thdxg/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_PAT }}
          path: tap

      - name: Bump cask
        working-directory: tap
        run: |
          sed -i '' -E "s/^( *version )\".*\"/\1\"${VERSION}\"/" Casks/macterm.rb
          sed -i '' -E "s/^( *sha256 )\".*\"/\1\"${{ steps.hash.outputs.sha256 }}\"/" Casks/macterm.rb
          if git diff --quiet Casks/macterm.rb; then
            echo "No changes — cask already at ${VERSION}."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/macterm.rb
          git commit -m "macterm ${VERSION}"
          git push origin HEAD:main
