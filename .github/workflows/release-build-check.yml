name: Release build check

# TEMPORARY, for the runner move to `xcode-27`: release.yml and release-tip.yml
# run only from a published release and from main, and they publish. This
# runs their build part on a pull request — the same toolchain, setup and
# scripts/build.sh, a universal Release archive and a DMG — with no signing
# certificate, no Sparkle key and nothing published. Remove it before the
# move merges, or keep it as a pull-request guard for the release build.

on:
  pull_request:
    branches: [main]

concurrency:
  group: release-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release build (no publish)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: jdx/mise-action@v5.2.0

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Cache epoch
        id: epoch
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit
        uses: actions/cache@v6
        with:
          path: |
            GhosttyKit.xcframework
            Macterm/Resources/ghostty
            Macterm/Resources/terminfo
            Macterm/Resources/zmx
            .zmx-tag
            .ghosttykit-tag
          key: ghosttykit-${{ hashFiles('scripts/setup.sh') }}-${{ steps.epoch.outputs.week }}

      - name: Setup GhosttyKit
        run: mise run setup --verbose

      # Ad-hoc signed (no MACTERM_CODESIGN_IDENTITY) and with the Sparkle
      # placeholder key: build.sh accepts both for a build that is never
      # distributed.
      - name: Build universal Release artifact
        run: |
          source scripts/_lib.sh
          VERSION="$(macterm_tip_version)" ./scripts/build.sh

      - name: Check the bundle
        run: |
          APP=build/export/Macterm.app
          codesign --verify --deep --strict "$APP"
          lipo -info "$APP/Contents/MacOS/Macterm"
          lipo -info "$APP/Contents/Helpers/macterm-icon-renderer"
          ls -la build/*.dmg
