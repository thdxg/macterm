name: Server

# Builds the session server in server/ and runs its Zig tests and its bats
# tests where it runs: macOS, Linux x86_64 and Linux aarch64. On macOS it also
# checks the files that the protocol schema makes (scripts/protocol.sh). The
# builds that the app bundles come from server-build.yml.
#
# The three Test checks are required on main, and a required check must report
# on every pull request. So the workflow starts on every pull request, and each
# job skips its steps when the pull request changes no file in the paths below.
# The skip is at step level: a matrix job that a job-level if: skips reports
# its unexpanded name, which never matches the required name.
#
# The steps are the composite action .github/actions/server-test. The macOS
# entry runs as two jobs, and the job Test (macOS) only reports their result.
# A macOS job that gets no runner runs no step, and the platform cancels it
# after about 18 minutes (feedback of 2026-11-12). Only then does the second
# job run. A step that fails is a real failure and is not tried again. The
# gate job keeps the name that the ruleset requires.
#
# macOS runs on macos-15: zig cannot link with Xcode 26.4 or later
# (zig#31658), and the macOS 27 runner has nothing older.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "server/**"
      - "protocol/**"
      - "Macterm/Protocol/**"
      - "scripts/build-server.sh"
      - "scripts/protocol.sh"
      - "scripts/server-zig.sh"
      - ".github/workflows/server.yml"
      - ".github/actions/server-test/**"

permissions:
  contents: read

concurrency:
  group: server-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 4 vCPU, not 2 like the light jobs: Zig compiles with every core,
          # so 2 vCPU takes about twice as long for about the same billed
          # vCPU-minutes, and aarch64 is already the slowest required check.
          - name: Linux x86_64
            runner: blacksmith-4vcpu-ubuntu-2404
          - name: Linux aarch64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      # Depth 2: the merge commit of the pull request and its two parents.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/server-test

  macos:
    name: Run (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/server-test

  # The second try, only when the first job was cancelled. A cancel of the
  # whole run (a newer push) skips it.
  macos-retry:
    name: Run (macOS, Retry)
    needs: macos
    if: ${{ !cancelled() && needs.macos.result == 'cancelled' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/server-test

  # The required check. It passes when one of the two tries passed.
  test-macos:
    name: Test (macOS)
    needs: [macos, macos-retry]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the Result
        shell: bash
        env:
          FIRST: ${{ needs.macos.result }}
          RETRY: ${{ needs.macos-retry.result }}
        run: |
          echo "first=$FIRST retry=$RETRY"
          [ "$FIRST" = success ] || [ "$RETRY" = success ]
