name: Server

# Builds the session server in server/ and runs its Zig tests and its bats
# tests where it runs: macOS, Linux x86_64 and Linux aarch64. On macOS it also
# checks the files that the protocol schema makes (scripts/protocol.sh). The
# builds that the app bundles come from server-build.yml.
#
# The three Test checks are required on main, and a required check must report
# on every pull request. So the workflow starts on every pull request, and each
# job skips its steps when no file in its paths-filter changed. The skip is at
# step level: a matrix job that a job-level if: skips reports its unexpanded
# name, which never matches the required name.
#
# macOS runs on macos-15: zig cannot link with Xcode 26.4 or later
# (zig#31658), and the xcode-27 image has nothing older.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "server/**"
      - "protocol/**"
      - "Macterm/Protocol/**"
      - "scripts/build-server.sh"
      - "scripts/protocol.sh"
      - ".github/workflows/server.yml"

permissions:
  contents: read
  # paths-filter reads the files of a pull request through the API.
  pull-requests: read

concurrency:
  group: server-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
          - name: Linux x86_64
            runner: ubuntu-latest
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            server:
              - "server/**"
              - "protocol/**"
              - "Macterm/Protocol/**"
              - "scripts/build-server.sh"
              - "scripts/protocol.sh"
              - ".github/workflows/server.yml"

      - name: Zig Version
        if: steps.changes.outputs.server == 'true'
        id: zig
        working-directory: .
        run: echo "version=$(scripts/build-server.sh zig-version)" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        if: steps.changes.outputs.server == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: Install Bats
        if: steps.changes.outputs.server == 'true'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install bats-core
          else
            sudo apt-get update -q
            sudo apt-get install -y -q bats
          fi

      - name: Run the Zig Tests
        if: steps.changes.outputs.server == 'true'
        run: zig build test --summary all

      - name: Build
        if: steps.changes.outputs.server == 'true'
        run: zig build

      # The Swift side of the protocol is generated from the Zig schema
      # (design/003 §3). This step fails in three cases:
      # - a generated file is not current, or someone edited it;
      # - the schema breaks the add-only rule against the metadata on main;
      # - a reply or an event holds a secret (design/006 §1).
      - name: Check the Generated Protocol Files
        if: steps.changes.outputs.server == 'true' && runner.os == 'macOS'
        working-directory: .
        run: |
          git fetch --no-tags --depth=1 origin main
          PROTOCOL_BASE=FETCH_HEAD scripts/protocol.sh --check

      # TEMPORARY (issue 0072): repeat the level tests 50 times. Removed before merge.
      - name: Repeat the Level Tests
        if: steps.changes.outputs.server == 'true'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          fails=0
          for i in $(seq 50); do
            bats -f "level" test/attach_v2.bats > out.txt 2>&1 || { fails=$((fails+1)); cat out.txt; }
          done
          echo "fails=$fails of 50"
          [ "$fails" -eq 0 ]

      # A skipped test fails the step, so a missing tool cannot hide a test.
      # daemon_responsibility.bats tests a macOS concept, so Linux leaves it
      # out. The short TMPDIR keeps the socket paths under the macOS limit of
      # 104 bytes.
      - name: Run the Bats Tests
        if: steps.changes.outputs.server == 'true'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          files=()
          for f in test/*.bats; do
            if [ "$RUNNER_OS" != macOS ] && [ "$f" = test/daemon_responsibility.bats ]; then
              continue
            fi
            files+=("$f")
          done
          bats --tap "${files[@]}" | tee bats.tap
          if grep -qE '^ok [0-9]+ .* # skip' bats.tap; then
            echo "::error::A bats test was skipped."
            exit 1
          fi
