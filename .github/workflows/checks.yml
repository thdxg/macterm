name: Checks

# Style gates only — the test suites live in test.yml (named so checks group
# as "Test / Unit" and "Test / End-to-end" in the PR UI).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels the runs of its older commit, so they
# do not keep the macOS runners that the new jobs need. A push to main has a
# group for each commit and is never cancelled: release-tip.yml needs the Test
# and Checks results of each commit on main.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # scripts/** because format.sh/lint.sh/_lib.sh are the job bodies;
          # mise.toml because it pins the swiftformat/swiftlint versions.
          filters: |
            swift:
              - "**/*.swift"
              - "mise.toml"
              - "scripts/**"
              - ".swiftformat"
              - ".swiftlint.yml"
              - ".github/workflows/checks.yml"

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v5.2.7

      - name: Format
        run: mise run format --check --verbose

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v5.2.7

      - name: Lint
        run: mise run lint --verbose
