name: Checks

# Style gates only — the test suites live in test.yml (named so checks group
# as "Test / Unit" and "Test / End-to-end" in the PR UI), the resource
# benchmark in benchmark.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # scripts/** because format.sh/lint.sh/_lib.sh are the job bodies;
          # mise.toml because it pins the swiftformat/swiftlint versions.
          filters: |
            swift:
              - "**/*.swift"
              - "mise.toml"
              - "scripts/**"
              - ".swiftformat"
              - ".swiftlint.yml"
              - ".github/workflows/checks.yml"

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v4.3.0

      - name: Format
        run: mise run format --check --verbose

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v4.3.0

      - name: Lint
        run: mise run lint --verbose
