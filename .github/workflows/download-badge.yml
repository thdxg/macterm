name: Download Badge

# The README's download count. shields.io's own `github/downloads/total` badge
# reads only the first page of releases (the newest 100), so once the repo
# passed 100 releases it stopped counting the oldest ones and drifted low. This
# job sums every asset of every release, following pagination, and publishes the
# result in shields' endpoint schema for `img.shields.io/endpoint?url=…`.
#
# The file lives alone on an orphan `badges` branch, force-pushed as a single
# commit: gh-pages is the appcast store, and publish-appcast.sh's clone-then-push
# has no retry, so a badge commit landing between its clone and its push would
# fail a release publish.
on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-badge
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Count downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].assets[].download_count' | awk '{s += $1} END {print s + 0}')
          echo "Total downloads: $total"
          mkdir badge
          # 950 → "950", 12960 → "12.9k", 1234567 → "1.2M". The count rounds
          # down, so the badge never shows more downloads than there are.
          jq -n --argjson n "$total" '
            def short($div; $unit):
              (. * 10 / $div | floor) as $t | "\($t / 10 | floor).\($t % 10)\($unit)";
            {
              schemaVersion: 1,
              label: "downloads",
              message: (if $n < 1000 then ($n | tostring)
                        elif $n < 1000000 then ($n | short(1000; "k"))
                        else ($n | short(1000000; "M")) end),
              color: "brightgreen"
            }' > badge/downloads.json
          cat badge/downloads.json

      - name: Publish to the badges branch
        working-directory: badge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add downloads.json
          git commit -q -m "Update download count"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
