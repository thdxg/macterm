version: 2
updates:
  # The workflows and the composite actions in .github/actions. Each action
  # gets one PR for all the directories (group-by), so that a pin in a
  # composite action cannot stay behind the workflows.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area:ci
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        group-by: dependency-name
        patterns:
          - "*"

  # The website image's bases (oven/bun, caddy). Nothing else in the repo
  # builds an image, so this watches website/Containerfile alone.
  - package-ecosystem: docker
    directory: "/website"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area:ci
    commit-message:
      prefix: chore
      include: scope
