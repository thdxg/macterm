# Pinned exactly (not "latest"): swiftformat/swiftlint output is part of the CI
# contract — a new release can change rules and turn a green main red on
# untouched code, and float local vs CI. Bump these in deliberate commits.
[tools]
gh = "2.95.0"
swiftformat = "0.61.1"
swiftlint = "0.63.3"
xcodegen = "2.45.4"
xcbeautify = "3.2.1"

[settings]
task.output = "quiet"

# ─── Tasks ──────────────────────────────────────────────────────────────────
# Every task takes a -v/--verbose flag. Without it (local dev) the task runs
# behind scripts/_lib.sh's run_step spinner, which hides logs while running and
# prints them only on failure. With --verbose (used by CI) the script runs
# directly so all output streams inline. This replaces the old parallel ci:*
# tasks — CI now calls e.g. `mise run setup --verbose`.

[tasks.run]
description = "Run the app"
depends = ["format", "lint"]
usage = 'flag "-v --verbose" help="Stream raw output instead of the spinner"'
run = """
  source scripts/_lib.sh
  if [[ "$usage_verbose" == "true" ]]; then
    ./scripts/run.sh
  else
    run_step "Running..." ./scripts/run.sh
  fi
"""

[tasks.build]
description = "Build release app and DMG"
depends = ["format", "lint", "test"]
usage = 'flag "-v --verbose" help="Stream raw output instead of the spinner"'
# The DMG name embeds $VERSION, so it can't be listed as a static output —
# `auto` tracks a hash of the task definition instead. Inputs are everything
# that reaches the archive: Swift sources, the xcodegen spec, the Info.plist /
# entitlements / icon that project.yml references, and the build + embed
# scripts. GhosttyKit and Macterm/Resources/{ghostty,terminfo,zmx} are
# setup.sh-downloaded gitignored artifacts, refreshed by deleting them, so
# their absence is caught by setup.sh rather than by this check.
sources = [
  "Macterm/**/*.swift",
  "CLI/**/*.swift",
  "Macterm/Info.plist",
  "Macterm/Macterm.entitlements",
  "Macterm/AppIcon.icon/**/*",
  "project.yml",
  "scripts/build.sh",
  "scripts/setup.sh",
  "scripts/embed-zmx.sh",
  "scripts/_lib.sh",
]
outputs = { auto = true }
run = """
  source scripts/_lib.sh
  if [[ "$usage_verbose" == "true" ]]; then
    ./scripts/build.sh
  else
    run_step "Building..." ./scripts/build.sh
  fi
"""

[tasks.logs]
description = "Stream live logs from the debug app"
usage = '''
flag "--release" help="Tail the release app instead of the debug app"
flag "--last <duration>" help="Show past logs for a duration (e.g. 1h, 30m) instead of streaming live"
'''
run = """
  args=()
  [[ "$usage_release" == "true" ]] && args+=(--release)
  [[ -n "${usage_last:-}" ]] && args+=(--last "$usage_last")
  ./scripts/logs.sh "${args[@]}"
"""

[tasks.install]
description = "Install built app to /Applications"
depends = ["build"]
usage = 'flag "-v --verbose" help="Stream raw output instead of the spinner"'
run = """
  source scripts/_lib.sh
  if [[ "$usage_verbose" == "true" ]]; then
    ./scripts/install.sh
  else
    run_step "Installing to /Applications..." ./scripts/install.sh
  fi
"""

[tasks.setup]
description = "Download GhosttyKit framework and resources"
usage = 'flag "-v --verbose" help="Stream raw output instead of the spinner"'
run = """
  source scripts/_lib.sh
  if [[ "$usage_verbose" == "true" ]]; then
    ./scripts/setup.sh
  else
    run_step "Setting up GhosttyKit..." ./scripts/setup.sh
  fi
"""

[tasks.format]
description = "Format Swift code (use --check to verify only)"
usage = '''
flag "-v --verbose" help="Stream raw output instead of the spinner"
flag "--check" help="Verify formatting without modifying files (CI mode)"
'''
# swiftformat walks the repo root minus `build,GhosttyKit,scripts`
# (.swiftformat), which in practice is these three Swift dirs. `auto` outputs:
# formatting rewrites its own inputs, so there's no separate artifact to stat.
sources = ["Macterm/**/*.swift", "CLI/**/*.swift", "MactermTests/**/*.swift", ".swiftformat"]
outputs = { auto = true }
run = """
  source scripts/_lib.sh
  args=()
  msg="Formatting..."
  if [[ "$usage_check" == "true" ]]; then
    args+=(--check)
    msg="Checking formatting..."
  fi
  if [[ "$usage_verbose" == "true" ]]; then
    ./scripts/format.sh "${args[@]}"
  else
    run_step "$msg" ./scripts/format.sh "${args[@]}"
  fi
"""

[tasks.lint]
description = "Run swiftlint"
usage = 'flag "-v --verbose" help="Stream raw output instead of the spinner"'
# Mirrors .swiftlint.yml's `included:` list, plus both configs (the nested
# MactermTests one relaxes rules for test code). Lint writes nothing, so `auto`
# stands in for a real output artifact.
sources = [
  "Macterm/**/*.swift",
  "CLI/**/*.swift",
  "MactermTests/**/*.swift",
  ".swiftlint.yml",
  "MactermTests/.swiftlint.yml",
]
outputs = { auto = true }
run = """
  source scripts/_lib.sh
  if [[ "$usage_verbose" == "true" ]]; then
    ./scripts/lint.sh
  else
    run_step "Linting..." ./scripts/lint.sh
  fi
"""

[tasks.test]
description = "Run the test suite"
usage = 'flag "-v --verbose" help="Stream raw output instead of the spinner"'
# Tests are hosted inside the debug app, so the app and CLI sources are inputs
# too, as is project.yml (test.sh regenerates the Xcode project from it).
# DerivedData is a build dir, not a stable artifact to stat, hence `auto`.
sources = [
  "Macterm/**/*.swift",
  "CLI/**/*.swift",
  "MactermTests/**/*.swift",
  "Macterm/Info.plist",
  "project.yml",
  "scripts/test.sh",
  "scripts/setup.sh",
]
outputs = { auto = true }
run = """
  source scripts/_lib.sh
  if [[ "$usage_verbose" == "true" ]]; then
    ./scripts/test.sh
  else
    run_step "Testing..." ./scripts/test.sh
  fi
"""

[tasks.bench]
description = "Build the release app and run the window-state benchmark"
usage = 'flag "-v --verbose" help="Stream raw output instead of the spinner"'
run = """
  source scripts/_lib.sh
  if [[ "$usage_verbose" == "true" ]]; then
    ./scripts/bench.sh
  else
    run_step "Benchmarking..." ./scripts/bench.sh
  fi
"""

[tasks.e2e]
description = "Build the debug app and run the end-to-end suite against it"
usage = 'flag "-v --verbose" help="Stream raw output instead of the spinner"'
run = """
  source scripts/_lib.sh
  if [[ "$usage_verbose" == "true" ]]; then
    ./scripts/e2e.sh
  else
    run_step "Running e2e suite..." ./scripts/e2e.sh
  fi
"""

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf build Macterm.xcodeproj"

[tasks.stats]
description = "Show download statistics"
run = "scripts/stats.sh"
